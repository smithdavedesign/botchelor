# After Dark's own host on DigitalOcean App Platform (docs/after-dark-hosting.md, "3. DigitalOcean App Platform").
# Create it with: Apps → Create App → "Import from app spec" (or `doctl apps create --spec .do/app.yaml`), then fill in
# every value marked CHANGE_ME as an encrypted secret in the dashboard. Never commit real values to this file.
# Billing: $10 a month for the instance below, and the hourly job by the second it runs (well under $1 a month); set a
# spend alert at $15 (runbook step 7). The names below are the live app's (`botchelor`, its service `botchelor`).
name: botchelor
region: sfo
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: ad.botchelor.com
    type: PRIMARY
services:
  - name: botchelor
    github:
      repo: smithdavedesign/botchelor
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    # Emailed to the account: a restart loop, memory near the 1 GB limit, a pegged CPU.
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 1
        window: FIVE_MINUTES
    envs:
      # The routing and redirects are read at build time as well as run time.
      - key: AFTER_DARK_ONLY
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: DEPLOY_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      # The commit this build came from (lib/deploy.ts commitSha), filled in by DigitalOcean (/admin's Servers panel).
      - key: COMMIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_AND_BUILD_TIME
      - key: AFTER_DARK_ORIGIN
        value: https://ad.botchelor.com
        scope: RUN_AND_BUILD_TIME
      - key: SITE_URL
        value: https://botchelor.com
        scope: RUN_AND_BUILD_TIME
      # "Continue the night in After Dark" on an overnight date (lib/adult/overnight.ts; docs/hosting.md). On by default;
      # "0" takes its page and route away here (set it on the show's app too, .do/show.yaml, to take the button away).
      # - key: OVERNIGHT_AFTER_DARK
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_ZONE
        value: botchelor-ad
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_REGION
        value: ny
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_CDN_HOST
        value: media.botchelor.com
        scope: RUN_AND_BUILD_TIME
      # Secrets: the same values as Vercel production's, from the keychain. Encrypted in the dashboard.
      - key: DATABASE_URL
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: SESSION_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      # The invite-only beta's request email is sent from this host (lib/adult/invites.ts): same as the show's.
      - key: CONTACT_EMAIL
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: RESEND_API_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: FRONTIER_PASSWORD
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: CRON_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_TOKEN_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      # Never set here: ADULT_MODE, NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_GTM_ID, the site-verification tokens, MEDIA_S3_*.
# The scheduled jobs run from here: one small container calls the show's (lobby, daily) on botchelor.com, so that work
# runs on the show's own app (.do/show.yaml), and After Dark's (after-dark-daily, showcase-check) on ad.botchelor.com,
# where After Dark's media is (#1009). Billed by the second it runs: a few minutes an hour, well under $1 a month.
jobs:
  - name: lobby  # runs both hourly jobs; renaming a component needs a delete, so it keeps its first name
    kind: SCHEDULED
    schedule:
      cron: "20 * * * *"
      time_zone: UTC
    image:
      registry_type: DOCKER_HUB
      registry: library
      repository: alpine
      tag: "3.20"
    # Every hour at :20 the lobby on botchelor.com, then:
    # - at 16:20 UTC the daily job, one part per request with a pause between (app/api/jobs/daily; run whole, it held
    #   the show's only instance for minutes and 504'd botchelor.com twice on 2026-11-11), then After Dark's daily job;
    # - in the other hours, the showcase check on ad.botchelor.com, and before it, from 17:20 to 23:20, the daily job's
    #   resume pass: a part a deploy cut off, or one that failed, runs again (lib/daily-parts.ts), up to two a run, until
    #   it answers resumed: null.
    # DigitalOcean ends a run at 30 minutes, so nothing waits idle (a 20-minute sleep before the showcase check took the
    # 16:20 run to the limit on 2026-11-20). Each answer streams and ends ok: true once the work finished; a call
    # without it prints FAILED and fails the run (exit 1), where an echo used to hide it. tests/scheduled-job.test.ts
    # runs this command against a stand-in wget.
    run_command: >-
      sh -c 'fail=0; call() { r=$(wget -q -O - -T 290 -U "botchelor-cron/1.0 (DigitalOcean)"
      --header "Authorization: Bearer $CRON_SECRET" "https://$1/api/jobs/$2"); echo "$r";
      case "$r" in *\"ok\":true*) return 0;; esac; echo "FAILED: $1 $2"; fail=1; return 1; };
      call botchelor.com lobby; h=$(date -u +%H); if [ "$h" = "16" ]; then
      for p in upkeep show people growth; do [ "$p" = upkeep ] || sleep 45; call botchelor.com "daily?part=$p"; done;
      call ad.botchelor.com after-dark-daily; else case "$h" in 17|18|19|20|21|22|23)
      for i in 1 2; do call botchelor.com "daily?part=resume" || break; case "$r" in *\"resumed\":null*) break;; esac;
      sleep 45; done;; esac; call ad.botchelor.com showcase-check; fi; exit $fail'
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      # The same value as Vercel production's CRON_SECRET, encrypted in the dashboard.
      - key: CRON_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_TIME
