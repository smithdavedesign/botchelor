# After Dark's own host on DigitalOcean App Platform (docs/after-dark-hosting.md, "3. DigitalOcean App Platform").
# Create it with: Apps → Create App → "Import from app spec" (or `doctl apps create --spec .do/app.yaml`), then fill in
# every value marked CHANGE_ME as an encrypted secret in the dashboard. Never commit real values to this file.
# Billing: about $10 a month for the instance below, plus at most $5 for the hourly jobs; set a spend alert at $15 (runbook step 7).
name: botchelor-after-dark
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: ad.botchelor.com
    type: PRIMARY
services:
  - name: web
    github:
      repo: smithdavedesign/botchelor
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    envs:
      # The routing and redirects are read at build time as well as run time.
      - key: AFTER_DARK_ONLY
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: DEPLOY_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: AFTER_DARK_ORIGIN
        value: https://ad.botchelor.com
        scope: RUN_AND_BUILD_TIME
      - key: SITE_URL
        value: https://botchelor.com
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_ZONE
        value: botchelor-ad
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_REGION
        value: ny
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_CDN_HOST
        value: media.botchelor.com
        scope: RUN_AND_BUILD_TIME
      # Secrets: the same values as Vercel production's, from the keychain. Encrypted in the dashboard.
      - key: DATABASE_URL
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: SESSION_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      # The invite-only beta's request email is sent from this host (lib/adult/invites.ts): same as the show's.
      - key: CONTACT_EMAIL
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: RESEND_API_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: FRONTIER_PASSWORD
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: CRON_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_TOKEN_KEY
        type: SECRET
        value: CHANGE_ME
        scope: RUN_AND_BUILD_TIME
      # Never set here: ADULT_MODE, NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_GTM_ID, the site-verification tokens, MEDIA_S3_*.
# The scheduled jobs run from here: one small container calls the show's (lobby, daily) on botchelor.com, so that work
# runs on the show's own app (.do/show.yaml), and After Dark's (after-dark-daily, showcase-check) on ad.botchelor.com,
# where After Dark's media is (#1009). About $5 a month at most.
jobs:
  - name: lobby  # runs both hourly jobs; renaming a component needs a delete, so it keeps its first name
    kind: SCHEDULED
    schedule:
      cron: "20 * * * *"
      time_zone: UTC
    image:
      registry_type: DOCKER_HUB
      registry: library
      repository: alpine
      tag: "3.20"
    # The lobby every hour at :20, the daily job at 16:20 UTC, and the showcase check about twenty minutes later.
    run_command: >-
      sh -c 'call() { wget -q -O - -T 290 -U "botchelor-cron/1.0 (DigitalOcean)"
      --header "Authorization: Bearer $CRON_SECRET" "https://$1/api/jobs/$2"; echo; };
      call botchelor.com lobby; if [ "$(date -u +%H)" = "16" ]; then call botchelor.com daily; call ad.botchelor.com after-dark-daily; fi;
      sleep 1200; call ad.botchelor.com showcase-check'
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      # The same value as Vercel production's CRON_SECRET, encrypted in the dashboard.
      - key: CRON_SECRET
        type: SECRET
        value: CHANGE_ME
        scope: RUN_TIME
