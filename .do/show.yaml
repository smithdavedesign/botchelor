# The show (botchelor.com) on DigitalOcean App Platform, since 2026-10-30 (docs/hosting.md). After Dark has its own
# app (.do/app.yaml). Secrets are CHANGE_ME here: fill them in the dashboard (Encrypt), the same values as before.
# Never commit real values to this file. Billing: $12 a month for the instance below.
name: botchelor-show
region: sfo
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: botchelor.com
    type: PRIMARY
  - domain: www.botchelor.com
    type: ALIAS
  - domain: staging.botchelor.com
    type: ALIAS
services:
  - name: web
    github:
      repo: smithdavedesign/botchelor
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    envs:
      # DEPLOY_ENV=production is what VERCEL_ENV=production was on Vercel (lib/deploy.ts): real payments, analytics,
      # IndexNow. SITE_URL is the show's address (lib/site.ts), read at build time as well.
      - key: DEPLOY_ENV
        value: "production"
        scope: RUN_AND_BUILD_TIME
      - key: SITE_URL
        value: "https://botchelor.com"
        scope: RUN_AND_BUILD_TIME
      - key: OAUTH_REDIRECT_BASE
        value: "https://botchelor.com"
        scope: RUN_AND_BUILD_TIME
      - key: AFTER_DARK_ORIGIN
        value: "https://ad.botchelor.com"
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_S3_BUCKET
        value: "botchelor-media"
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_S3_ENDPOINT
        value: "https://br-winter-bird-b7gfzy20.storage.c-13.us-east-1.aws.neon.tech"
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_S3_REGION
        value: "us-east-1"
        scope: RUN_AND_BUILD_TIME
      # After Dark files made here go to its Bunny zone, the show's own stay in the bucket (lib/object-store.ts byArea).
      - key: MEDIA_BUNNY_ZONE
        value: "botchelor-ad"
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_REGION
        value: "ny"
        scope: RUN_AND_BUILD_TIME
      - key: MEDIA_BUNNY_CDN_HOST
        value: "media.botchelor.com"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_GA_ID
        value: "G-VHL1LZTPHL"
        scope: RUN_AND_BUILD_TIME
      # Search Console HTML-tag token (backup to public/google12d185eff6366504.html; the old tokens were Vercel-only and lost).
      - key: GOOGLE_SITE_VERIFICATION
        value: "lGbVj_m5QXyUaTRceMwGq6qW2n28ebTGkZTtoZpeA1k"
        scope: RUN_AND_BUILD_TIME
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: "8798420854-7ptpgn2uttpm2pf3io3531qv4fi91bgl.apps.googleusercontent.com"
        scope: RUN_AND_BUILD_TIME
      - key: FRONTIER_DEFAULT
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: FRONTIER_LLM_BASE_URL
        value: "https://openrouter.ai/api/v1"  # OPENROUTER_SHOW_KEY, $50 cap (2026-10-31; was Vercel AI Gateway)
        scope: RUN_AND_BUILD_TIME
      - key: FRONTIER_LLM_MODEL
        value: "anthropic/claude-haiku-5.5"
        scope: RUN_AND_BUILD_TIME
      # Companions open to everyone, with the Companion Plan (docs/companions.md, 2026-11-04).
      - key: COMPANION_OPEN
        value: "1"
        scope: RUN_AND_BUILD_TIME
      # Step into the date is open to everyone, guests included (docs/step-into-the-date.md "The switches", 2026-11-15).
      # Uncomment one to close it without a deploy of code: STEP_IN_OPEN "0" = admins only again; STEP_IN_GUESTS "0" =
      # a visitor signs in first; STEP_IN_GUEST_DAILY_MAX = guest dates a day across the show (default 300, "0" = none).
      # - key: STEP_IN_OPEN
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: STEP_IN_GUESTS
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: STEP_IN_GUEST_DAILY_MAX
      #   value: "300"
      #   scope: RUN_AND_BUILD_TIME
      # A newcomer's instant first date plays as a speed date by default (lib/first-date.ts firstDateFormat; docs/hosting.md).
      # Uncomment to pick another free format without a deploy; a premium or unknown id falls back to speed_date.
      # - key: FIRST_DATE_FORMAT
      #   value: "speed_date"
      #   scope: RUN_AND_BUILD_TIME
      # The fast first date (lib/fast-date.ts; docs/date-quality.md "Round: the fast first date"). Speed dates start
      # fast by default: no director call before line 1, the recap/texts/reflections written side by side.
      # "0" puts every date back on the old order; "all" starts every format fast.
      # - key: FAST_FIRST_LINE
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # A speed date's actor calls on another model id at the show's paid endpoint, or another thinking level
      # (minimal|low|medium|high). Both unset by default: the show's model as it is (measured: leave them unset).
      # - key: SPEED_DATE_MODEL
      #   value: ""
      #   scope: RUN_AND_BUILD_TIME
      # - key: SPEED_DATE_REASONING
      #   value: "low"
      #   scope: RUN_AND_BUILD_TIME
      # One-sentence create (lib/express-create.ts; docs/flows.md): on by default. Uncomment with "0" to put the form
      # back as /create's first step without a deploy.
      # - key: EXPRESS_CREATE
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # A character's questions about its own sheet (lib/character-questions.ts; docs/companions.md): on by default.
      # Uncomment with "0" and the daily job sends none.
      # - key: CHARACTER_QUESTIONS
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # The characters' weekly lessons (lib/character-lessons.ts; docs/character-depth.md §12): on by default.
      # Uncomment with "0" and nothing is written, carried in a prompt, shown or texted; the rows stay.
      # - key: CHARACTER_LESSONS
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # Life dates a day (lib/character-life.ts weeklyLifeDates; docs/hosting.md): the house takes each owned character
      # out once a week, house-paid, ~1¢ each. Default 30; "0" turns them off without a deploy.
      # - key: LIFE_DATES_PER_DAY
      #   value: "30"
      #   scope: RUN_AND_BUILD_TIME
      # Open casting (lib/casting.ts; docs/seasons.md "Open casting"): a new character's first date goes to the
      # Botchelor's lead, roses for walk-ons on Sunday. On by default and inert until a lead format is picked on
      # /admin/season; "0" closes it without a deploy.
      # - key: OPEN_CASTING
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # The daily house scene (lib/house-scenes.ts; docs/seasons.md "The house"): on by default, one free-model call a
      # day or a template. "0" writes no scene and /house says the house is quiet, without a deploy.
      # - key: HOUSE_SCENES
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # Confrontations and the weekly challenge (lib/house-conflict.ts; docs/seasons.md "Confrontations and
      # challenges"): on by default. "0" stops new ones without a deploy.
      # - key: CONFRONTATIONS
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: CHALLENGES
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # The model league (lib/model-league.ts; docs/hosting.md): /agents/league and /api/league/models, on by default.
      # "0" takes the page, its JSON and the links to it away without a deploy; models are still kept and dates stamped.
      # - key: MODEL_LEAGUE
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # The character's phone (docs/hosting.md; all three on by default, "0" turns one off without a deploy of code):
      # a photo from the date in the character's texts (lib/date-photo.ts), a cast character's opener written from its
      # last aired date (lib/cast-opener.ts), and the owner's home opening on their character's phone (lib/character-phone.ts).
      # - key: DATE_PHOTO_TEXTS
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: COMPANION_DATE_OPENER
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: HOME_PHONE
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # The After Dark bridge (lib/adult/bridge.ts; docs/hosting.md): one line on the creator's verdict card after a
      # second date, to the invite request. On by default; "0" takes it away without a deploy.
      # - key: AD_BRIDGE
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # Overnight dates (lib/overnight-shared.ts; docs/hosting.md). Both on by default; "0" turns one off without a deploy:
      # OVERNIGHT_DATES is the whole feature, OVERNIGHT_AFTER_DARK only the "Continue the night in After Dark" button
      # (set that one on After Dark's app too, .do/app.yaml).
      # - key: OVERNIGHT_DATES
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # - key: OVERNIGHT_AFTER_DARK
      #   value: "0"
      #   scope: RUN_AND_BUILD_TIME
      # Copied from the old Vercel project's values (not secret, but deployment-specific).
      - key: CONTACT_EMAIL
        value: "CHANGE_ME"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_STRIPE_PAYMENT_LINK
        value: "CHANGE_ME"
        scope: RUN_AND_BUILD_TIME
      - key: STRIPE_PAYMENT_LINK
        value: "CHANGE_ME"
