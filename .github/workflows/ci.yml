# Typecheck + the unit suite, by hand. Runs on the hosted free runner.
#
# Minute discipline (this repo is private, so free minutes are capped):
#   - concurrency cancels older runs on the same branch
#   - a 15-minute timeout kills a hung run before it eats the budget
# True-free alternative (not applied here): make the repo public, or add a self-hosted runner.
# gh workflow run ci.yml --ref <branch> still works for a manual kick.
name: CI

on:
  # By hand only (gh workflow run ci.yml --ref <branch>), as BUILD.md says (#575, 2026-10-21): the repo is private, so
  # every run spends the account's free Actions minutes, which RepoHQ needs. A later pass turned on every PR and push
  # again, and with the minutes out it only left a check that never starts. PRs merge on the local tsc + full vitest.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
