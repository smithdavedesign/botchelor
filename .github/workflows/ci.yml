# Typecheck + the unit suite on every PR and on main. Runs on the hosted free runner.
#
# Minute discipline (this repo is private, so free minutes are capped):
#   - paths-ignore skips docs-only and config-only changes
#   - concurrency cancels older runs on the same branch
#   - a 15-minute timeout kills a hung run before it eats the budget
# True-free alternative (not applied here): make the repo public, or add a self-hosted runner.
# gh workflow run ci.yml --ref <branch> still works for a manual kick.
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
