# Typecheck + the unit suite, by hand. Runs on the hosted free runner.
#
# The repo is public now, so Actions minutes are free. The guards stay:
#   - concurrency cancels older runs on the same branch
#   - a 15-minute timeout kills a hung run
# gh workflow run ci.yml --ref <branch> starts a run.
name: CI

on:
  # By hand only (gh workflow run ci.yml --ref <branch>), by choice, as BUILD.md says. It was switched off for PRs and
  # pushes on 2026-10-21 (#575), when the repo was private and every run spent the account's free Actions minutes.
  # PRs merge on the local tsc + full vitest.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
