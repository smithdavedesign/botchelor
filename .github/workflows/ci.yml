# Typecheck + the unit suite, by hand only: gh workflow run ci.yml --ref <branch>
# It used to run on every PR and every push to main, which spent the account's free Actions minutes (this repo is
# private) that RepoHQ needs. The same two commands run locally before every merge (BUILD.md), and Vercel's check
# proves each PR builds, so the automatic run only repeated them.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
