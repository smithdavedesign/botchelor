# CodeQL code scanning, free on a public repo: GitHub's security queries over the TypeScript and JavaScript, the
# workflows themselves and the live-face workers' Python. Findings land in the repo's Security tab (Code scanning).
# Once a day on main and by hand (gh workflow run codeql.yml), never on a pull request: it isn't one of main's
# required checks, bz-merge-when-green.sh waits for every check a PR shows, and a scan on each of the day's ~100 merges
# would hold runners the CI jobs need. Added 2026-11-22 (audit).
name: CodeQL

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
