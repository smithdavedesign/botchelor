# Builds the Ditto live-face worker image (workers/live-face-ditto: Ditto talking head on TensorRT, Runpod Serverless)
# for linux/amd64 and pushes it to GitHub's registry as a tag of the SAME package as the MuseTalk worker
# (botchelor-live-face, public since 2026-11-13), so Runpod can pull it without a registry credential. Tags are
# `ditto-<run number>` on pushes and `ditto-<tag>` by hand; never :latest, which Runpod caches per host.
name: live-face ditto worker image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (e.g. v1 → ditto-v1)"
        required: true
        default: "v1"
  push:
    branches: ["live-face-ditto-*"]
    paths: ["workers/live-face-ditto/**", "!workers/live-face-ditto/*.md", ".github/workflows/live-face-ditto-worker.yml"]
permissions:
  contents: read
  packages: write
concurrency: live-face-ditto-worker
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for a 9 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/live-face-ditto
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/botchelor-live-face:${{ inputs.tag && format('ditto-{0}', inputs.tag) || format('ditto-{0}', github.run_number) }}
          cache-from: type=gha,scope=ditto
          cache-to: type=gha,mode=max,scope=ditto
      - name: Image
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/botchelor-live-face:${{ inputs.tag && format('ditto-{0}', inputs.tag) || format('ditto-{0}', github.run_number) }}" | tee -a "$GITHUB_STEP_SUMMARY"
