# Builds the live-face worker image (workers/live-face: MuseTalk 1.5 on Runpod Serverless) for linux/amd64 and pushes
# it to GitHub's registry. Run by hand with a tag; the Runpod template points at that tag (never :latest, which Runpod
# caches per host). About 15 minutes; the image is ~11 GB with the weights baked in.
name: live-face worker image
on:
  # By hand with a tag (from main); for the worker's own branches, every push that touches the worker builds
  # `dev-<run number>`: a fresh tag each time, because Runpod caches an image per tag on each host and would keep
  # serving the old build under a reused one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1)"
        required: true
        default: "v1"
  push:
    branches: ["live-face-*"]
    paths: ["workers/live-face/**", ".github/workflows/live-face-worker.yml"]
permissions:
  contents: read
  packages: write
concurrency: live-face-worker
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for an 11 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/live-face
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/botchelor-live-face:${{ inputs.tag || format('dev-{0}', github.run_number) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/botchelor-live-face:${{ inputs.tag || format('dev-{0}', github.run_number) }}" | tee -a "$GITHUB_STEP_SUMMARY"
