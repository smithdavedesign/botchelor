# Publishes registry/server.json to the official MCP Registry (registry.modelcontextprotocol.io) as
# io.github.smithdavedesign/botchelor. GitHub OIDC proves the namespace, so no token or login is stored anywhere.
# Runs when the entry changes on main (bump its "version": a version can be published once), or by hand:
# gh workflow run mcp-registry.yml
name: MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [registry/server.json]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: registry
        run: ../mcp-publisher publish
